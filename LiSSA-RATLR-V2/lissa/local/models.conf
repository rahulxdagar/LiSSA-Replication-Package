# Local Ollama setup for the LiSSA replication (RQ1). Sourced by run-local-benchmark.sh.
# Values can be overridden from the environment, e.g. LLM_PRIMARY=llama3.1:8b bash run-local-benchmark.sh

OLLAMA_URL="${OLLAMA_URL:-http://127.0.0.1:11434}"

# Classifier LLM (replaces gpt-4o-2024-05-13). The fallback is used for the whole run only if the
# primary cannot be used (not pulled, fails to load, or does not fit completely on the GPU).
LLM_PRIMARY="${LLM_PRIMARY:-qwen2.5-coder:14b}"
LLM_FALLBACK="${LLM_FALLBACK:-gemma4:12b}"

# Embedding model (replaces text-embedding-3-large), same fallback rule.
EMBEDDING_PRIMARY="${EMBEDDING_PRIMARY:-bge-m3}"
EMBEDDING_FALLBACK="${EMBEDDING_FALLBACK:-llama3.1:8b}"

# Context length requested for every Ollama call. Models with a smaller window are capped by Ollama
# (bge-m3: 8192); the preflight records the effective value in the generated configs.
NUM_CTX="${NUM_CTX:-16384}"

# 1 = a model only counts as usable if Ollama loads it 100% on the GPU (Metal).
REQUIRE_FULL_GPU="${REQUIRE_FULL_GPU:-1}"
